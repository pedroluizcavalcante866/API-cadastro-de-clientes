	<div class="container">
		<div class="modal fade" id="myModal" role="dialog">
			<div class="modal-dialog">
				<div class="panel panel-default">
					<div class="panel-heading">
						<h3 class="panel-title text-center">CADASTRO DE CLIENTE</h3>
					</div>
					
					<div class="panel-body">
						<form action="#" class="form-horizontal">
							<fieldset>
								<legend>Dados Pessoais</legend>

								<input type="hidden" id="IdClientes" value="0">

								<div class="form-group">
									<label for="Documento" class="col-sm-2 control-label">Documento</label>
									<div class="col-sm-4">
										<input type="text" class="form-control" id="Documento">
									</div>
								</div>

								<div class="form-group">
									<label for="nome" class="col-sm-2 control-label">Nome</label>
									<div class="col-sm-4">
										<input type="text" class="form-control" id="nome">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">Sexo</label>
									<div class="col-sm-4">
										<label class="radio-inline">
											<input type="radio" name="sexo" value="F"> Feminino
										</label>

										<label class="radio-inline">
											<input type="radio" name="sexo" value="M"> Masculino
										</label>
									</div>
								</div>

							</fieldset>
							
							<fieldset>
								<legend>Contato</legend>
								<div class="form-group">
									<label for="email" class="col-sm-2 control-label">Email</label>
									<div class="col-sm-4">
										<input type="email" class="form-control" id="email">
									</div>
								</div>
								
								<div class="form-group">
									<label for="telefone" class="col-sm-2 control-label">Telefone</label>
									<div class="col-sm-4">
										<input type="tel" class="form-control" id="telefone">
									</div>
								</div>
								<div class="form-group">
									<label for="fax" class="col-sm-2 control-label">Fax</label>
									<div class="col-sm-4">
										<input type="tel" class="form-control" id="fax">
									</div>
								</div>
							</fieldset>
							
							<fieldset>
								<div class="form-group">
									<label for="uf" class="col-sm-2 control-label">UF</label>
									<div class="col-sm-4">
										<select class="form-control" name="uf" id="uf">
											<option value="AC">AC</option>
											<option value="AL">AL</option>
											<option value="AM">AM</option>
											<option value="AP">AP</option>
											<option value="BA">BA</option>
											<option value="CE">CE</option>
											<option value="DF">DF</option>
											<option value="ES">ES</option>
											<option value="GO">GO</option>
											<option value="MA">MA</option>
											<option value="MG">MG</option>
											<option value="MS">MS</option>
											<option value="MT">MT</option>
											<option value="PA">PA</option>
											<option value="PE">PE</option>
											<option value="PI">PI</option>
											<option value="PR">PR</option>
											<option value="RJ">RJ</option>
											<option value="RN">RN</option>
											<option value="RO">RO</option>
											<option value="RR">RR</option>
											<option value="RS">RS</option>
											<option value="SC">SC</option>
											<option value="SE">SE</option>
											<option value="SP">SP</option>
											<option value="TO">TO</option>
										</select>
									</div>
								</div>
							</fieldset>
							
							<button type="button" class="btn btn-primary" onclick="javascript:SalvarCadastro();">
								<span class="glyphicon glyphicon-floppy-disk" aria-hidden="true"></span> Gravar
							</button>
						</form>
						
					</div>
				</div>
			</div>
		</div>
		<div class="panel panel-default">
			<div class="panel-heading">
				<h3 class="panel-title text-center">CLIENTES CADASTRADOS</h3>
			</div>
			
			<div class="panel-body">
				<a  data-toggle="modal" data-target="#myModal" class="btn btn-primary">
					<span class="glyphicon glyphicon-plus" aria-hidden="true"></span> Novo
				</a>	
				<div class="table-responsive">
					<table id="ListaCadastro" class="table table-striped table-hover">
						<thead>
							<tr>
								<th>Id</th>
								<th>Documento</th>
								<th>NOME</th>
								<th>EMAIL</th>
								<th>TELEFONE</th>
								<th>AÇÕES</th>
							</tr>
						</thead>
					</table>
				</div>
			</div>
		</div>
	</div>
	
	<script>
        $('#myModal').on('hidden.bs.modal', function () {
            LimparCamposForm();
		});

		ListarClientes();

		function SalvarCadastro() {

			var Clientes = {};

            var idAtual = parseInt($("#IdClientes").val()) || 0;

            if (idAtual == 0 || idAtual == null) { 
                var novoId = Math.floor(Math.random() * (99999 - 10000 + 1)) + 10000;
                Clientes.IdClientes = novoId;
			} 
			else {
                Clientes.IdClientes = idAtual;
            }

			Clientes.documento = $("#Documento").val();
			Clientes.nome = $("#nome").val();
			Clientes.sexo = $('input[name="sexo"]:checked' ).val()
			Clientes.email = $("#email").val();
			Clientes.telefone = $("#telefone").val();
			Clientes.fax = $("#fax").val();
			Clientes.uf = $("#uf").val();
            
		
			

            var validar = 1;

            if (Clientes.documento == "") {
                validar = 0;
                alert('O campo documento é obrigatório');
                $("#Documento").css("border-color", "red");
            }

            if (Clientes.nome == "") {
                alert('O campo Nome é obrigatório');
                $("#nome").css("border-color", "red");
                validar = 0;
            }

            if (validar == 1) {
                $.ajax({
                    type: "POST",
                    url: "https://localhost:44310/api/Clientes/Salvar",
                    data: JSON.stringify(Clientes),
                    contentType: "application/json; charset=utf-8",
                    dataType: "json",
                    success: function (msg) {
						alert('Sucesso!');
                        location.reload();
                        AdicionarLinhaTabela(Clientes.documento, Clientes.nome, Clientes.email, Clientes.telefone);
                        $('#myModal').modal('hide'); // Fecha o modal
                        LimparCamposForm();          // Limpa tudo
                        location.reload();
                    },
                    error: function (xhr, status, error) {
                        console.log("Status: " + status);
                        console.log("Erro: " + error);
                        console.log("Resposta: " + xhr.responseText);
                        alert('Erro: ' + error);
                    }
                });
				
                //AdicionarLinhaTabela(Clientes.documento, Clientes.nome, Clientes.email, Clientes.telefone);
				LimparCamposForm();
			}
		}
		function AdicionarLinhaTabela(IdCliente, Documento, Nome, Email, Telefone)
		{			
			var linhaNova = '<tr id="Linha' + IdCliente + '"><td>';
            linhaNova = linhaNova + IdCliente + '</td><td>' + Documento + '</td><td>' + Nome + '</td><td>' + Email + '</td><td>' + Telefone + '</td><td><a href="#" onclick="GetCliente(\'' + IdCliente + '\');"  class="btn btn-info"><span class="glyphicon glyphicon-edit" aria-hidden="true"></span> Editar</a><a href="#" onclick="RemoveLinha(\'' + IdCliente + '\');" class="btn btn-danger"><span class="glyphicon glyphicon-trash" aria-hidden="true"></span> Excluir</a></td></tr>';
			
			$("#ListaCadastro").prepend(linhaNova);
			$('#myModal').modal().hide();
		}
		
		function LimparCamposForm()
		{
            $("#IdClientes").val(0); 
            $("#Documento").val("");
            $("#nome").val("");
            $("#email").val("");
            $("#telefone").val("");
            $("#fax").val("");
            $("#uf").val("AC"); 
            $('input[name="sexo"]' ).prop("checked", false);
		}
		
		function RemoveLinha(IdClientes)
		{
            $.ajax({
                type: "DELETE",
                url: "https://localhost:44310/api/Clientes/Deletar?IdClientes=" + IdClientes,
                contentType: "application/json; charset=utf-8",
                dataType: "json",
				success: function (OBJ) {
                    $('#Linha' + IdClientes).remove();
                },
				error: function (OBJ) {
                    console.log("Mensagem de erro:", OBJ.responseText);
                    alert('errordelete');
                }

			});


		}

		function GetCliente(IdClientes) {

            $('#myModal').on('hidden.bs.modal', function () {
                LimparCamposForm();
			});

            $.ajax({
                type: "GET",
                url: "https://localhost:44310/api/Clientes/GetCliente",
				contentType: "application/json; charset=utf-8",
                data: { IdClientes: IdClientes },
                dataType: "json",
				success: function (OBJ) {
                    
					$('#myModal').modal().show();

                    $("#IdClientes").val(OBJ.idClientes);
					$("#Documento").val(OBJ.documento);
					$("#nome").val(OBJ.nome);
					$("#email").val(OBJ.email);
					$("#telefone").val(OBJ.telefone);
					$("#fax").val(OBJ.fax);
					$("#uf").val(OBJ.uf);
                    $('input[name="sexo"][value="' + OBJ.sexo + '"]' ).prop("checked", true);
				},

                error: function (xhr, status, error) {
                    console.log("Status: " + status);
                    console.log("Erro: " + error);
                    console.log("Resposta: " + xhr.responseText);
					alert('Erro: ' + error);

                }
		
            });
		}

		function ListarClientes() {
            $.ajax({
                type: "GET",
                url: "https://localhost:44310/api/Clientes/Listar",
                contentType: "application/json; charset=utf-8",
                dataType: "json",
				success: function (OBJ) {
                    listaGlobalClientes = OBJ;
					for (var i = 0; i < OBJ.length; i++) {

						AdicionarLinhaTabela(OBJ[i].idClientes, OBJ[i].documento, OBJ[i].nome, OBJ[i].email, OBJ[i].telefone);

					}
									
                },
                error: function (OBJ) {
                    alert('error');
                }

            });

		}

	</script>
	
</body>
